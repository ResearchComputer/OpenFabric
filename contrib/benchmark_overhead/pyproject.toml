[project]
name = "benchmark-overhead"
version = "0.1.0"
description = "OpenTela routing-overhead benchmark for LLM inference"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
benchmark-overhead = "benchmark_overhead.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark_overhead"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
